# Modèle de fiche pour la demande d'inclusion dans F-Droid (dépôt gitlab.com/fdroid/fdroiddata,
# fichier metadata/fr.florian.radio.yml). Les relecteurs F-Droid peuvent l'ajuster.
# Description, captures et icône sont lues dans fastlane/metadata/android de ce dépôt.
Categories:
  - Multimedia
License: GPL-3.0-only
SourceCode: https://github.com/florianfish/MyRadioPlayer
IssueTracker: https://github.com/florianfish/MyRadioPlayer/issues
Changelog: https://github.com/florianfish/MyRadioPlayer/releases

AutoName: Radio

RepoType: git
Repo: https://github.com/florianfish/MyRadioPlayer.git

Builds:
  # versionCode = majeur*10000 + mineur*100 + correctif (calculé par app/build.gradle.kts)
  - versionName: 1.9.0
    versionCode: 10900
    commit: v1.9.0
    subdir: app
    gradle:
      - fdroid
    gradleprops:
      - appVersion=1.9.0

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.9.0
CurrentVersionCode: 10900
